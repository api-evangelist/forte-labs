aid: forte-labs
name: Forte Labs
description: >-
  Forte builds on-chain compliance and economic tooling for games and Web3
  applications. Its flagship developer product, the Forte Rules Engine, is an
  open-source EVM protocol that lets developers define powerful, flexible, and
  composable on-chain policies — for regulatory compliance, risk management, and
  token-economy design — without hardcoding rules into their smart contracts.
  The engine centers on policies, rules, trackers, and calling/foreign
  contracts, ships client contracts for the ERC20/721/1155/721A token
  standards, and is consumed through a TypeScript SDK. Forte was founded in 2019
  and is backed by Andreessen Horowitz, Battery Ventures, Griffin Gaming
  Partners, and Canaan. This profile catalogs Forte's public developer surface —
  Rules Engine documentation, SDK, and GitHub organization.
